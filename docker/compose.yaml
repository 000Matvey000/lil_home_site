services:
  home-hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: home-hub
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: 3001
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - home_hub_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  home_hub_data:
